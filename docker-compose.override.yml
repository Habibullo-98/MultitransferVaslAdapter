services:
  postgres:
    container_name: postgres-multitrabsfer-db
    environment:
      POSTGRES_DB: multitransfer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - postgres-multitrabsfer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multitransfer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ps-multitransfer-in-service:
    ports:
      - "10013:8080"
    environment:
      Db__ConnectionString: "Host=127.0.0.1;Port=5434;Database=multitransfer_db;Username=postgres;Password=postgres123"
      Redis__ConnectionString: "127.0.0.1:6379,password=myredispassword123,abortConnect=false"
      Vasl__BaseUrl: "https://localhost:2215" 
      Vasl__SecretKey: "S@cretK@y"
      Vasl__PartnerId: "1" #For test environment use 1, for production use 2
      Vasl__ServiceId: "1"
      Hmac__ApiKey: "public"
      Hmac__Secret: "shared_secret"
    volumes:
      - /home/services/apps/Logs/PsMultiTransferInTest/:/app/Logs

volumes:
  postgres-multitrabsfer-db: